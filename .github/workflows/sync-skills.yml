name: Sync Skills to ClawHub

on:
  pull_request:
    paths:
      - "skills/**"
      - "plugin.json"
      - ".claude-plugin/**"
      - ".github/schemas/**"
      - ".github/scripts/validate_clawhub_publish.py"
      - ".github/scripts/validate_codex_install.py"
      - ".github/scripts/validate_plugin.py"
      - ".github/scripts/validate_agent_plugins_spec.py"
      - ".github/scripts/validate_skill_commands.py"
      - ".github/scripts/validate_skill_semantics.py"
      - ".github/scripts/validate_skill_references.py"
      - ".github/scripts/check_rez_version_drift.py"
      - "scripts/install_codex.py"
      - ".github/workflows/sync-skills.yml"
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "plugin.json"
      - ".claude-plugin/**"
      - ".github/schemas/**"
      - ".github/scripts/validate_codex_install.py"
      - ".github/scripts/validate_plugin.py"
      - ".github/scripts/validate_agent_plugins_spec.py"
      - ".github/scripts/validate_skill_commands.py"
      - ".github/scripts/validate_skill_semantics.py"
      - "scripts/install_codex.py"
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: sync-skills-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The rez release every skill in this repository is written against. The
  # lanes below install exactly this version, so the commands, flags and
  # upstream documentation pages they are checked against cannot drift out from
  # under the prose. .github/workflows/rez-version-drift.yml reads this line on
  # a schedule and fails once upstream has released something newer.
  REZ_VERSION: "3.4.0"

jobs:
  validate-plugin:
    name: Validate plugin layout
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate the agent plugin manifest and every skill
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/validate_plugin.py --strict

  # `.claude-plugin/plugin.json` is the manifest Claude reads. `plugin.json` at
  # the plugin root is the layout the Agent Plugins specification says any
  # conforming client can load -- read the manifest, then discover
  # `skills/<name>/SKILL.md` -- which is what lets a Codex plugin install, or
  # another client's, pick this tree up without a fork. It is checked against
  # the schema the specification publishes, vendored under `.github/schemas/`,
  # so a key the specification does not define is rejected rather than waved
  # through because nobody thought to forbid it.
  validate-agent-plugins-spec:
    name: Validate the Agent Plugins manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install the JSON Schema validator
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check jsonschema
      - name: Validate plugin.json against the Agent Plugins 1.0.0 schema
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/validate_agent_plugins_spec.py --strict

  validate-codex-install:
    name: Exercise the Codex installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Links on POSIX, copies on Windows: both modes have to install and
        # roll back cleanly on the platform that actually uses them. macOS is a
        # POSIX machine in its own right -- it is where the symlink branch runs
        # most often in a VFX facility, and APFS/spaces-in-path behaviour is
        # not something the Linux runner can vouch for.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install, re-install, and uninstall in throwaway sandboxes
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/validate_codex_install.py --strict

  validate-skill-commands:
    name: Smoke-test documented rez commands
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install pinned rez
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check "rez==$REZ_VERSION"
          rez --version
      - name: Validate every rez command the skills document
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/validate_skill_commands.py --strict

  # The static lane above only proves that a flag exists; the flags it knows
  # about are read from the same rez CLI this pin installs. This lane is the
  # other half: it runs the documented commands against a throwaway package
  # repository and asserts on what comes back, which is the only way to catch a
  # command that is made entirely of real flags and still means nothing.
  validate-skill-semantics:
    name: Execute documented rez commands
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install pinned rez
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check "rez==$REZ_VERSION"
          rez --version
      - name: Run the documented commands against a fixture repository
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/validate_skill_semantics.py

  # The two lanes above check the commands that sit in shell fences and the
  # ones prose writes out with a flag. A *bare* `rez-<name>` in prose is
  # neither: the static lane skips it on purpose, because such a token is
  # usually a cross-reference to another skill or to the Rez docs. That skip is
  # a blind spot -- `rez-package-preprocessing` shipped through it while every
  # lane was green. This lane is the other half of the skip: those tokens have
  # to resolve to something real.
  validate-skill-references:
    name: Resolve rez cross-references in prose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install pinned rez
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check "rez==$REZ_VERSION"
          rez --version
      - name: Resolve every rez reference the prose makes
        env:
          # Reading the upstream docs tree unauthenticated shares a 60/hour
          # budget with every other job on the runner's IP.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/validate_skill_references.py --strict

  discover:
    needs: validate-plugin
    name: Discover skills
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      skills: ${{ steps.list.outputs.skills }}
      count: ${{ steps.list.outputs.count }}
    steps:
      # The plugin root is the repository root, so skills/ stays the single source
      # of truth for both `claude plugin install` and the ClawHub publish below.
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: List skill directories
        id: list
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d skills ]]; then
            echo "::error::The skills/ directory does not exist."
            exit 1
          fi
          mapfile -t dirs < <(find skills -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)
          if [[ ${#dirs[@]} -eq 0 ]]; then
            echo "::error::No skill directories found under skills/."
            exit 1
          fi
          printf '%s\n' "${dirs[@]}"
          {
            echo "count=${#dirs[@]}"
            printf 'skills='
            printf '%s\n' "${dirs[@]}" | jq -R . | jq -sc .
          } >> "$GITHUB_OUTPUT"

  publish:
    name: ${{ github.event_name == 'pull_request' && 'Dry run' || 'Publish' }} ${{ matrix.skill }}
    # Every validation lane has to be in this list, not just the ones that
    # happen to sit upstream of `discover`. `release: published` carries no
    # path filter, so on a real release every lane runs -- and a lane whose
    # failure does not stop `publish` is a lane that is decoration: the skill
    # ships whether it passes or not. `validate-codex-install` is a matrix job,
    # so this waits for the whole matrix, which is the point.
    needs:
      - discover
      - validate-agent-plugins-spec
      - validate-codex-install
      - validate-skill-commands
      - validate-skill-semantics
      - validate-skill-references
    if: ${{ github.event_name != 'release' || github.event.release.prerelease == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        skill: ${{ fromJson(needs.discover.outputs.skills) }}
    env:
      CLAWHUB_CLI_VERSION: "0.23.3"
      CLAWHUB_DISABLE_TELEMETRY: "1"
      SKILL_PATH: skills/${{ matrix.skill }}
      SKILL_SLUG: ${{ matrix.skill }}
      PUBLISH: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install pinned ClawHub CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts --no-audit --no-fund \
            "clawhub@$CLAWHUB_CLI_VERSION"
          [[ "$(clawhub --cli-version)" == "$CLAWHUB_CLI_VERSION" ]]

      - name: Verify source provenance
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ -z "$(git status --short)" ]]

      - name: Require merged manual publish source
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Manual ClawHub publishes must run from refs/heads/main."
            exit 1
          fi

      - name: Require publish credentials
        if: ${{ env.PUBLISH == 'true' }}
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLAWHUB_TOKEN:-}" ]]; then
            echo "::error::Real ClawHub publishes require the CLAWHUB_TOKEN repository secret."
            exit 1
          fi

      - name: Write ephemeral ClawHub configuration
        if: ${{ env.PUBLISH == 'true' }}
        env:
          CLAWHUB_CONFIG_PATH: ${{ runner.temp }}/clawhub-config.json
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          fs.writeFileSync(
            process.env.CLAWHUB_CONFIG_PATH,
            JSON.stringify({ registry: "https://clawhub.ai", token: process.env.CLAWHUB_TOKEN }) + "\n",
            { mode: 0o600 },
          );
          NODE

      - name: Preview and optionally publish the skill
        env:
          CLAWHUB_CONFIG_PATH: ${{ runner.temp }}/clawhub-config.json
          PREVIEW_PATH: ${{ runner.temp }}/clawhub-preview.json
          RECEIPT_PATH: ${{ runner.temp }}/clawhub-publish.json
        shell: bash
        run: |
          set -euo pipefail
          args=(
            skill publish "$SKILL_PATH"
            --owner loonghao
            --tags latest
            --source-repo "$GITHUB_REPOSITORY"
            --source-commit "$GITHUB_SHA"
            --source-ref "$GITHUB_REF"
            --source-path "$SKILL_PATH"
            --json
          )

          # The dry run needs no credentials and proves the packaging chain works.
          clawhub "${args[@]}" --dry-run > "$PREVIEW_PATH"
          python3 .github/scripts/validate_clawhub_publish.py \
            "$PREVIEW_PATH" \
            --mode dry-run \
            --expected-slug "$SKILL_SLUG"

          if [[ "$PUBLISH" != "true" ]]; then
            cp "$PREVIEW_PATH" "$RECEIPT_PATH"
            exit 0
          fi

          # Skip the network round trip when the public bundle already matches.
          if node -e '
            const receipt = require(process.env.PREVIEW_PATH);
            const publiclyCurrent =
              receipt.status === "unchanged" && receipt.version === receipt.latestVersion;
            process.exit(publiclyCurrent ? 0 : 1);
          '; then
            cp "$PREVIEW_PATH" "$RECEIPT_PATH"
            exit 0
          fi

          publish_version="$(node -p 'require(process.env.PREVIEW_PATH).version')"
          catalog_args=()
          if node -e '
            const receipt = require(process.env.PREVIEW_PATH);
            const firstPublish = receipt.status === "would-publish" && receipt.latestVersion === null;
            process.exit(firstPublish ? 0 : 1);
          '; then
            # The registry rejects category slugs that are not on its own list --
            # "Unknown skill category slug" -- so only slugs published skills
            # already carry may appear here. `developer-tools` and `documentation`
            # are not on that list, and passing them failed all eight first
            # publishes. Topics are free-form and carry the rest of the metadata.
            catalog_args=(
              --categories development,knowledge
              --topics rez,package-manager,vfx,dependency-resolution,environment-management
            )
          fi

          clawhub "${args[@]}" --version "$publish_version" \
            "${catalog_args[@]}" > "$RECEIPT_PATH"

      - name: Validate ClawHub receipt
        env:
          MODE: ${{ github.event_name == 'pull_request' && 'dry-run' || 'publish' }}
          PREVIEW_PATH: ${{ runner.temp }}/clawhub-preview.json
          RECEIPT_PATH: ${{ runner.temp }}/clawhub-publish.json
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/validate_clawhub_publish.py \
            "$RECEIPT_PATH" \
            --mode "$MODE" \
            --expected-slug "$SKILL_SLUG" \
            --preview "$PREVIEW_PATH"

      - name: Remove ephemeral ClawHub configuration
        if: ${{ always() && env.PUBLISH == 'true' }}
        env:
          CLAWHUB_CONFIG_PATH: ${{ runner.temp }}/clawhub-config.json
        shell: bash
        run: rm -f -- "$CLAWHUB_CONFIG_PATH"

      - name: Preserve ClawHub receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clawhub-${{ github.event_name }}-${{ matrix.skill }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/clawhub-preview.json
            ${{ runner.temp }}/clawhub-publish.json
          if-no-files-found: warn
          retention-days: 30
