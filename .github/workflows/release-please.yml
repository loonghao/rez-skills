name: Release Please

# Release-please turns the conventional commits landing on main into a release
# PR, then into a tag and a GitHub release. Keeping it here also makes it the
# single owner of .claude-plugin/plugin.json: the `extra-files` updater in
# release-please-config.json is what moves the version the ClawHub publish
# reads, so no release can be tagged while the shipped plugin still reports the
# previous one.
#
# The publish link at the bottom is explicit on purpose. A release created with
# the GITHUB_TOKEN does not start another workflow run by itself, so the
# `release: published` event in sync-skills.yml can never fire for these
# releases; `workflow_dispatch` is one of the events they can still start, and
# sync-skills.yml refuses to publish from anywhere but refs/heads/main -- which
# is exactly the ref passed below.
on:
  push:
    branches: [main]
  # A release commit only reaches the tag on a later run, and the merge that
  # creates it does not start one by itself. Without a manual entry point, a run
  # that failed for an environment reason -- an unset repository permission, a
  # registry outage -- stays failed until someone happens to push again.
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Open or update the release PR, and release once it is merged
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # This job has no checkout step, so the working directory is not a git
      # repository and `gh` cannot resolve the target from a remote. Without an
      # explicit --repo the call dies with
      # "failed to run git: fatal: not a git repository", which is what stopped
      # every release from publishing its skills. --ref main is what lets
      # sync-skills.yml past its "Require merged manual publish source" gate.
      - name: Publish the skills for the release
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run sync-skills.yml --repo "$GH_REPO" --ref main
